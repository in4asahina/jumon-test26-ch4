<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>情報Ⅰ・第4章・情報通信ネットワークとデータの活用 十問テスト【練習用：用語問題】</title>
<style id="app-style">
/* Layout: 旧Excel版「小テスト」シートの列幅・行高をそのまま比率で再現した1枚のグリッド。単一のライトテーマ（Excelと同じ見た目）に固定。 */
:root{
  --sheet-bg:#D7E4BD;   /* シート全体の緑 */
  --head:#EBF1DE;       /* 見出しセル */
  --qcell:#DBEEF4;      /* 問題文・氏名 */
  --time:#CCC1DA;       /* 開始・終了・受験時間 */
  --score:#C6D9F1;      /* 得点 */
  --cell:#FFFFFF;       /* 入力セル */
  --ink:#000000;
  --muted:#4F6228;
  --head-ink:#000000;   /* 見出しセルの文字 */
  --numcell:#EBF1DE;    /* 番号・問題区分 */
  --name-bg:#DBEEF4;    /* 氏名セル */
  --red:#FF0000;
  --line:#000000;
  --pick-bg:#FFF8DC;    /* 選択肢リスト（薄い黄色） */
  --pick-hover:#F6E3A1; /* 選択中の行 */
  --pick-edge:#4F6228;  /* リストの枠（シートの濃い緑） */
  --pick-rule:#EADFB4;
  --btn:#F0F0F0;
  --btn-edge:#7A7A7A;
  --font:"MS PGothic","ＭＳ Ｐゴシック","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo","Noto Sans JP",sans-serif;
  --mono:"Consolas","Menlo","BIZ UDGothic","MS Gothic",monospace;
  color-scheme:light;
}
[hidden]{display:none!important;}
/* 練習用（用語）＝青、練習用（論理回路・プログラム）＝赤。第2章の練習用ファイルと同じ配色 */
:root.theme-blue{--sheet-bg:#C6D9F1;--head:#558ED5;--head-ink:#FFFFFF;--numcell:#DBEEF3;--qcell:#DBEEF3;--time:#C6D9F1;--score:#C6D9F1;--name-bg:#FFFFFF;--muted:#1F497D;}
:root.theme-purple{--sheet-bg:#CCC0DA;--head:#8064A2;--head-ink:#FFFFFF;--numcell:#E4DFEC;--qcell:#E4DFEC;--time:#E4DFEC;--score:#E4DFEC;--name-bg:#FFFFFF;--muted:#3F3151;}
:root.theme-red{--sheet-bg:#E6B9B8;--head:#C0504D;--head-ink:#FFFFFF;--numcell:#FDE9D9;--qcell:#FDE9D9;--time:#FDE9D9;--score:#FDE9D9;--name-bg:#FFFFFF;--muted:#7F2A28;}
.practice-badge{display:inline-block;margin-right:.6em;padding:0 .5em;background:var(--head);color:var(--head-ink);font-weight:bold;border-radius:2px;}
html,body{background:var(--sheet-bg);color:var(--ink);}
body{margin:0;font-family:var(--font);}
#app-root{padding-inline:16px;padding-block:16px 48px;}
.sheet-outer{container-type:inline-size;overflow-x:hidden;padding:3px;}
.sheet{
  --W:min(calc(100cqw - 6px),1900px);
  --pt:calc(var(--W) / 1213);
  width:var(--W);
  display:grid;
  /* A B C D EFG HIJKL M N O P Q R AB AC */
  grid-template-columns:8.875fr 4.625fr 6.25fr 8.43fr 25.29fr 42.15fr 12.625fr 16.25fr 11.5fr 6.25fr 30.5fr 22.5fr 15.625fr 20fr;
  grid-template-rows:repeat(4,calc(30*var(--pt))) repeat(10,minmax(calc(32.1*var(--pt)),auto));
  font-size:calc(11*var(--pt));
}
.c{display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px var(--line);background:var(--cell);min-width:0;position:relative;}
.thick{box-shadow:0 0 0 calc(1.6*var(--pt)) var(--line);z-index:1;}
.hdr{background:var(--head);color:var(--head-ink);font-size:calc(16*var(--pt));}
.big-hdr{font-size:calc(20*var(--pt));}
input.c,select.c{border:0;border-radius:0;margin:0;padding:0 calc(4*var(--pt));font-family:var(--font);color:var(--ink);width:100%;height:100%;box-sizing:border-box;text-align:center;}
#user{font-size:calc(22*var(--pt));background:var(--cell);}
#name{font-size:calc(20*var(--pt));background:var(--name-bg);}
input.c::placeholder{color:#8a9a6a;font-size:.6em;}
input.c:focus,.pick:focus-visible,.pick[aria-expanded="true"]{outline:calc(2.4*var(--pt)) solid #217346;outline-offset:calc(-2.4*var(--pt));z-index:3;}
.time{background:var(--time);font-size:calc(18*var(--pt));font-variant-numeric:tabular-nums;white-space:nowrap;}
.score-top{background:var(--score);font-size:calc(36*var(--pt));font-variant-numeric:tabular-nums;}
.score-sub{background:var(--score);font-size:calc(18*var(--pt));}
#mainBtn{
  grid-area:1/8/3/11;margin:calc(9*var(--pt)) calc(10*var(--pt)) calc(9*var(--pt)) calc(18*var(--pt));
  font-family:var(--font);font-size:calc(26*var(--pt));color:var(--ink);
  background:linear-gradient(#FCFCFC,var(--btn) 60%,#E1E1E1);border:1px solid var(--btn-edge);border-radius:calc(3*var(--pt));
  box-shadow:inset 0 0 0 1px #FFFFFF;cursor:pointer;white-space:nowrap;
}
#submitBtn{
  grid-area:15/3/16/5;align-self:start;width:auto;min-width:0;overflow:hidden;height:calc(40*var(--pt));
  margin:calc(16*var(--pt)) 0 0 0;padding:0;
  font-family:var(--font);font-size:calc(17*var(--pt));font-weight:bold;color:#3A2A00;
  background:linear-gradient(#FFF6CF,#F7DC74 60%,#EFC94A);border:1px solid #B08A1E;border-radius:calc(3*var(--pt));
  box-shadow:inset 0 0 0 1px #FFFFFF;cursor:pointer;white-space:nowrap;
}
#submitBtn:hover:not(:disabled){background:linear-gradient(#FFF9E0,#FBE58F 60%,#F3D35F);}
#submitBtn:disabled{cursor:default;color:#6B5A2A;background:linear-gradient(#FBF4DA,#EADCA8);}
#submitBtn:focus-visible{outline:2px solid #217346;outline-offset:2px;}
#submitBox{grid-area:15/5/16/13;margin-top:calc(16*var(--pt));margin-left:calc(10*var(--pt));background:#FFFFFF;border:calc(1.6*var(--pt)) solid #1F6E43;border-radius:calc(6*var(--pt));
  padding:calc(8*var(--pt)) calc(12*var(--pt));font-size:calc(14*var(--pt));color:#222;}
#submitBox .sb-h{font-weight:bold;font-size:calc(15*var(--pt));}
#submitBox .sb-row{display:flex;gap:calc(8*var(--pt));align-items:center;margin:calc(4*var(--pt)) 0;}
#submitBox input{flex:1 1 auto;min-width:0;font:calc(14*var(--pt)) ui-monospace,Consolas,monospace;padding:calc(4*var(--pt)) calc(6*var(--pt));border:1px solid #999;border-radius:calc(3*var(--pt));}
#submitBox button{font-family:var(--font);font-size:calc(14*var(--pt));font-weight:bold;padding:calc(4*var(--pt)) calc(10*var(--pt));cursor:pointer;white-space:nowrap;}
#submitBox .sb-meta{color:#555;font-size:calc(13*var(--pt));}
#submitBox .sb-id{font:bold calc(16*var(--pt)) ui-monospace,Consolas,monospace;letter-spacing:.1em;color:#1F6E43;}
#submitBox .sb-warn{color:#C00000;font-size:calc(13*var(--pt));}
#submitBox.err{border-color:#C00000;}
#submitBox.view{border-color:#3C7FB1;}
#gradeView{position:fixed;inset:0;z-index:60;background:#F4F6EF;overflow:auto;font:14px/1.6 var(--font);color:var(--ink);}
#gradeView .gv-in{max-width:1400px;margin:0 auto;padding:16px 20px 40px;}
#gradeView h2{margin:0 0 4px;font-size:20px;}
#gradeView .gv-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px;}
#gradeView .gv-top .sp{flex:1 1 auto;}
#gradeView textarea{width:100%;height:110px;box-sizing:border-box;font:13px ui-monospace,Consolas,monospace;padding:6px 8px;border:1px solid #999;border-radius:4px;}
#gradeView .gv-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0;}
#gradeView .gv-msg{color:#555;}
#gradeView .gv-sum{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0;}
#gradeView .gv-sum div{background:#FFF;border:1px solid #C8CFB8;border-radius:6px;padding:6px 12px;}
#gradeView .gv-sum b{font-size:20px;margin-left:4px;}
#gradeView table{border-collapse:collapse;background:#FFF;font-size:13px;transform-origin:0 0;}
#gradeView{overflow-x:hidden;}
#gradeView th,#gradeView td{border:1px solid #B9C2A6;padding:3px 6px;text-align:center;white-space:nowrap;}
#gradeView th{background:#E3EAD3;position:sticky;top:0;z-index:1;cursor:pointer;user-select:none;}
#gradeView td.l{text-align:left;}
#gradeView td.ok{color:#1F6E43;}
#gradeView td.ng{color:#C00000;font-weight:bold;}
#gradeView td.gsc{font-weight:bold;font-size:15px;}
#gradeView tr.dup td{background:#F2F2F2;color:#888;}
#gradeView tr.bad td{background:#FDECEC;}
#gradeView td.memo{max-width:280px;overflow:hidden;text-overflow:ellipsis;text-align:left;color:#666;}
#gradeView .rate td{background:#F7F9F2;font-weight:bold;}
#gradeView a{color:#1F5FA8;}
#mainBtn:hover{background:linear-gradient(#EAF6FD,#D9F0FC 60%,#BEE6FD);border-color:#3C7FB1;}
#mainBtn:active{background:linear-gradient(#C4E5F6,#98D1EF);}
#mainBtn:focus-visible{outline:2px solid #217346;outline-offset:2px;}
.sheet-title{grid-area:3/3/4/8;display:flex;align-items:center;padding-left:calc(4*var(--pt));font-size:calc(13*var(--pt));color:var(--muted);white-space:nowrap;overflow:hidden;min-width:0;}
#remain{grid-area:3/8/4/11;display:flex;align-items:center;justify-content:center;font-size:calc(15*var(--pt));color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;}
#remain.warn{color:#C00000;font-weight:bold;}
.cat{background:var(--numcell);font-size:calc(16*var(--pt));text-align:center;line-height:1.5;}
.num{background:var(--numcell);font-size:calc(16*var(--pt));}
.q{background:var(--qcell);justify-content:flex-start;text-align:left;padding:calc(3*var(--pt)) calc(5*var(--pt));font-size:calc(12*var(--pt));line-height:1.35;}
.q .qt{display:block;}
.q pre{margin:calc(3*var(--pt)) 0 0;font-family:var(--mono);font-size:calc(11.5*var(--pt));line-height:1.35;background:rgba(255,255,255,.55);padding:calc(3*var(--pt)) calc(8*var(--pt));white-space:pre;overflow-x:auto;}
.q .qbox{min-width:0;max-width:100%;}
.q.hide .qbox{visibility:hidden;}
.ans{font-size:calc(20*var(--pt));}
.pick{border:0;border-radius:0;margin:0;font-family:var(--font);color:var(--ink);width:100%;height:100%;box-sizing:border-box;white-space:nowrap;overflow:hidden;
  cursor:pointer;text-align:center;padding:0 calc(14*var(--pt)) 0 calc(4*var(--pt));background-color:var(--cell);
  background-image:linear-gradient(45deg,transparent 50%,#555 50%),linear-gradient(135deg,#555 50%,transparent 50%);
  background-position:calc(100% - 10*var(--pt)) 55%,calc(100% - 5*var(--pt)) 55%;
  background-size:calc(5*var(--pt)) calc(5*var(--pt));background-repeat:no-repeat;}
button.pick:disabled,input.c:disabled{cursor:default;background-image:none;opacity:1;color:var(--ink);-webkit-text-fill-color:var(--ink);}
.picklist{position:fixed;z-index:40;background:var(--pick-bg);border:2px solid var(--pick-edge);box-shadow:0 8px 18px rgba(40,50,20,.32);
  padding:4px 0;max-height:60vh;overflow:auto;font-family:var(--font);color:var(--ink);width:max-content;max-width:calc(100vw - 8px);box-sizing:border-box;}
.picklist .opt{padding:.32em 1.1em .32em 1.7em;white-space:nowrap;cursor:pointer;position:relative;line-height:1.3;}
.picklist .opt + .opt{border-top:1px solid var(--pick-rule);}
.picklist .opt.active{background:var(--pick-hover);}
.picklist .opt[aria-selected="true"]::before{content:"✓";position:absolute;left:.45em;color:var(--pick-edge);}
.picklist .opt.clear{color:var(--muted);font-size:.62em;padding-block:.55em;}
.sc{background:var(--score);font-size:calc(20*var(--pt));font-variant-numeric:tabular-nums;}
.sc.ng{color:var(--ink);}
.right{display:flex;align-items:center;padding-left:calc(4*var(--pt));color:var(--red);font-size:calc(20*var(--pt)*var(--rs,1));white-space:nowrap;overflow:hidden;gap:0 calc(8*var(--pt)*var(--rs,1));min-width:0;}
.right.wrap{flex-wrap:wrap;white-space:normal;align-content:center;line-height:1.15;}
.right small{font-size:calc(12*var(--pt)*var(--rs,1));}
.right .pg{color:var(--muted);font-size:calc(12*var(--pt)*var(--rs,1));}
.right-hdr{grid-area:4/13/5/15;color:var(--red);}
.status-line{grid-area:3/13/4/15;display:flex;align-items:center;padding-left:calc(6*var(--pt));font-size:calc(12*var(--pt));color:var(--muted);white-space:nowrap;}

.admin-link{position:fixed;right:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));font:12px var(--font);color:var(--muted);background:transparent;border:1px solid transparent;border-radius:4px;padding:4px 8px;cursor:pointer;}
.admin-link:hover,.admin-link:focus-visible{border-color:var(--muted);background:var(--head);}

/* モーダル */
.modal{position:fixed;inset:0;background:rgba(30,40,20,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow:auto;}
.panel{background:#FFFFFF;color:var(--ink);border:1px solid #6b7b4b;box-shadow:0 10px 30px rgba(0,0,0,.25);width:min(760px,100%);font:14px/1.6 var(--font);}
.panel h2{margin:0;padding:10px 16px;background:var(--head);border-bottom:1px solid #9bab7b;font-size:16px;}
.panel .bd{padding:14px 16px;display:grid;gap:14px;}
.panel .ft{padding:10px 16px;border-top:1px solid #d5dcc5;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}
.panel section{display:grid;gap:8px;}
.panel h3{margin:0;font-size:14px;border-left:4px solid #9BBB59;padding-left:8px;}
.panel p{margin:0;}
.panel .note{font-size:12px;color:#555;}
.pbtn{font:14px var(--font);padding:6px 14px;background:linear-gradient(#FCFCFC,#ECECEC);border:1px solid #8a8a8a;border-radius:3px;cursor:pointer;color:var(--ink);}
.pbtn:hover{background:linear-gradient(#EAF6FD,#CFEAFB);border-color:#3C7FB1;}
.pbtn.primary{background:linear-gradient(#5d9a3a,#3f7a22);color:#FFFFFF;border-color:#2f5c19;}
.pbtn.danger{color:#A00000;}
.pbtn:focus-visible{outline:2px solid #217346;outline-offset:2px;}
.panel input[type=password]{font:16px var(--font);padding:6px 8px;border:1px solid #888;width:200px;}
.drop{border:2px dashed #9BBB59;padding:14px;text-align:center;background:#F7FAF0;}
.drop.over{background:#E4EFD0;}
.tbl-wrap{overflow-x:auto;}
table.cnt{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;min-width:100%;}
table.cnt th,table.cnt td{border:1px solid #b9c4a5;padding:3px 8px;text-align:center;white-space:nowrap;}
table.cnt th{background:var(--head);}
table.cnt td.l{text-align:left;}
table.cnt td.zero{color:#C00000;font-weight:bold;}
ul.warn{margin:0;padding-left:20px;font-size:13px;color:#8a2a00;max-height:160px;overflow:auto;}
.msg{white-space:pre-wrap;}
@media (prefers-reduced-motion:no-preference){.modal .panel{animation:pop .12s ease-out;}@keyframes pop{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div id="app-root">
  <div class="sheet-outer">
    <div class="sheet" id="sheet">
      <div class="c hdr thick" style="grid-area:1/3/2/6">ユーザー名</div>
      <div class="c hdr thick" style="grid-area:1/6/2/8">氏　名</div>
      <input class="c thick" id="user" style="grid-area:2/3/3/6" autocomplete="off" spellcheck="false" placeholder="例：1A01" aria-label="ユーザー名">
      <input class="c thick" id="name" style="grid-area:2/6/3/8" autocomplete="off" spellcheck="false" placeholder="氏名を入力" aria-label="氏名">
      <button type="button" id="mainBtn">テスト開始</button>
      <div class="c time thick" id="tStart" style="grid-area:1/11/2/12"></div>
      <div class="c time thick" id="tEnd" style="grid-area:2/11/3/12"></div>
      <div class="c time thick" id="tDur" style="grid-area:3/11/4/12"></div>
      <div class="c score-top thick" style="grid-area:1/12/3/13"><span id="total"></span></div>
      <div class="c score-sub thick" style="grid-area:3/12/4/13">（10点満点）</div>
      <div class="sheet-title" id="sheetTitle"></div>
      <div id="remain" aria-live="polite"></div>
      <div class="status-line" id="statusLine"></div>
      <button type="button" id="submitBtn" hidden="">保存</button>
      <div id="submitBox" hidden="" aria-live="polite"></div>
      <div class="c hdr thick" style="grid-area:4/3/5/5">番号</div>
      <div class="c hdr thick" style="grid-area:4/5/5/11">問題</div>
      <div class="c hdr thick" style="grid-area:4/11/5/12">解答欄</div>
      <div class="c hdr thick" style="grid-area:4/12/5/13">得点</div>
      <div class="right right-hdr" id="rightHdr"></div>
      <div class="c cat thick" id="catA" style="grid-area:5/2/11/3">選<br>択<br>問<br>題</div>
      <div class="c cat thick" id="catB" style="grid-area:11/2/15/3">記<br>述<br>問<br>題</div>
    </div>
  </div>
  <button type="button" class="admin-link" id="adminLink">管理</button>
  <div class="picklist" id="pickList" role="listbox" aria-label="選択肢" hidden=""></div>

<script id="app-script">
(function(){

var BLANK_RE = /【[\s　]*】/;
var PLACEHOLDER = /^[-－ー―‐]{1,}$/;

/* ---------- 保存（使えない環境でも動くように） ---------- */
function lsGet(k, d){ try{ var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

/* ---------- 問題データ ---------- */
function b64ToStr(b64){
  var bin = atob(b64.replace(/\s+/g,'')), bytes = new Uint8Array(bin.length);
  for (var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
function strToB64(s){
  var bytes = new TextEncoder().encode(s), out = '', CH = 0x8000;
  for (var i=0;i<bytes.length;i+=CH) out += String.fromCharCode.apply(null, bytes.subarray(i, i+CH));
  return btoa(out);
}
var bank = null;
try { var raw = $('bank-data').textContent.trim(); if (raw && raw.indexOf('__') !== 0) bank = JSON.parse(b64ToStr(raw)); } catch(e) { bank = null; }
if (!bank) bank = { v:1, title:'十問テスト', settings:{}, genres:{}, items:[], roster:[], source:'(問題なし)' };

function setting(key, def){ var s = bank.settings || {}; return (s[key] === undefined || s[key] === '') ? def : s[key]; }
function mode(){ return bank.mode === 'term' || bank.mode === 'calc' || bank.mode === 'calc2' ? bank.mode : 'main'; }
/* 練習用（グループ9・10の記述問題）の名前：第3章は「プログラミング問題」、第4章は「計算問題」など。「設定」シートで変えられる */
function calcName(){ var n = String(setting('練習用（記述）の名前', '')).trim(); return n || 'プログラミング問題'; }
function calcFirst(){ var n = parseInt(setting('練習用（記述）のグループ9の問題数', 4), 10); return isFinite(n) ? Math.max(0, Math.min(10, n)) : 4; }
function calc2Name(){ return String(setting('練習用2（記述）の名前', '')).trim(); }
function hasCalc2(){ return !!calc2Name(); }
function prName(md){ return md === 'calc2' ? calc2Name() : calcName(); }
function isCalcMode(md){ return md === 'calc' || md === 'calc2'; }
function modeJa(md){ return md === 'term' ? '練習用（用語問題）' : isCalcMode(md) ? '練習用（' + prName(md) + '）' : '本番用'; }
function intSet(key, def){ var n = parseInt(setting(key, def), 10); return isFinite(n) && n >= 0 ? n : def; }
/* 「1-7」「1,2,3」のような書き方をグループ番号の配列にする */
function groupList(key, def){
  var t = String(setting(key, '')).trim(); if (!t) return def.slice();
  var out = [];
  t.replace(/[０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)-0xFEE0); }).split(/[,、，\s]+/).forEach(function(p){
    var m = p.match(/^(\d+)[-〜~～－](\d+)$/);
    if (m) { for (var k=+m[1]; k<=+m[2]; k++) out.push(k); } else if (/^\d+$/.test(p)) out.push(+p);
  });
  return out.length ? out : def.slice();
}
function termGroups(){ return groupList('用語問題のグループ', [1,2,3,4,5,6,7,8]); }
function mainCalcGroups(){ return groupList('本番：計算問題のグループ', []); }   // 空なら第3章と同じ（9・10を順不同）
function mainExcluded(){
  var t = String(setting('本番：出題しないパターン', '')).trim();
  return t ? t.split(/[,、，]+/).map(function(x){ return x.trim(); }).filter(Boolean) : [];
}
function nTf(){ return intSet('本番：○×の数', 3); }
function nMc(){ return intSet('本番：語群の数', 3); }
function nPick(md){ return isCalcMode(md) ? 0 : Math.min(10, nTf() + nMc()); }
function timeLimitMs(){ return minutesOf(mode()) * 60000; }
function timerOn(md){
  var v = md === 'main' ? setting('経過時間の表示', setting('残り時間の表示', 'しない')) : setting('練習用の経過時間の表示', 'しない');
  v = String(v).trim(); return v === 'する' || v === '表示する' || v.toUpperCase() === 'TRUE';
}
function showTimer(){ return timerOn(mode()); }
function kanaInsensitive(){ return String(setting('ひらがなとカタカナ','区別しない')).indexOf('区別しない') >= 0; }
function password(){ return String(setting('管理パスワード','1234')); }
function postUrl(){ return String(setting('結果送信URL','')).trim(); }
function titleFor(md){
  var base = String(setting('テスト名', bank.title || '十問テスト'));
  if (md === 'term') return String(setting('練習（用語問題）のテスト名', setting('練習（用語）のテスト名', base + '【練習用：用語問題】')));
  if (md === 'calc2') return String(setting('練習（' + calc2Name() + '）のテスト名', base + '【練習用：' + calc2Name() + '】'));
  if (md === 'calc') return String(setting('練習（' + calcName() + '）のテスト名', setting('練習（プログラミング問題）のテスト名', setting('練習（論理回路・プログラム）のテスト名', base + '【練習用：' + calcName() + '】'))));
  return base;
}
function testTitle(){ return titleFor(mode()); }
function minutesOf(md){
  var m = md === 'main' ? parseFloat(setting('試験時間（分）', 5)) : parseFloat(setting('練習用の試験時間（分）', 50));
  return isFinite(m) && m > 0 ? m : (md === 'main' ? 5 : 50);
}
/* 書き出すファイル名：【本番用】十問テスト_単元名.html など */
function fileNameFor(md){
  var unit = String(setting('単元名', '')).trim();
  if (!unit) { var m = String(setting('テスト名', '')).match(/・([^・\s]+)\s*十問テスト/); unit = m ? m[1] : '十問テスト'; }
  var name = md === 'term' ? '【練習用】十問テスト_' + unit + '（用語問題）' : isCalcMode(md) ? '【練習用】十問テスト_' + unit + '（' + prName(md) + '）' : '【本番用】十問テスト_' + unit;
  return name.replace(/[\\/:*?"<>|\s]+/g, '_') + '.html';
}

/* ---------- 採点用の正規化（旧版の LOWER(ASC()) を拡張） ---------- */
function norm(s){
  s = String(s == null ? '' : s).normalize('NFKC').toLowerCase().replace(/[\s　]+/g,'');
  for (var i=0;i<2;i++) s = s.replace(/([ァ-ヺー])[-‐‑‒–—―−]/g,'$1ー');
  if (kanaInsensitive()) s = s.replace(/[ぁ-ゖ]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)+0x60); });
  s = s.replace(/[。．.]+$/,'');
  return s;
}
function sameAnswer(input, answer){
  var a = norm(input), b = norm(answer);
  if (a === '' || b === '') return false;
  var na = a.replace(/,/g,''), nb = b.replace(/,/g,'');
  var NUM = /^[-+]?\d+(\.\d+)?$/;
  if (NUM.test(na) && NUM.test(nb)) return Number(na) === Number(nb);
  return a === b;
}

/* ---------- 出題（旧「出題」シートの手順を再現） ---------- */
function shuffle(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function eligible(it, type){ return type === 'tf' ? !!(it.tf && (it.tf.o || it.tf.x)) : !!it[type]; }
function patternKey(it){ return it.pt || String((it.fr || it.mc || {}).q || '').replace(/\d+(\.\d+)?/g, '#'); }
function makeQ(it, type){
  var q = { id:it.id, g:it.g, type:type, page:it.p || '' };
  if (type === 'tf') {
    var isO = Math.random() < 0.5;
    if (isO && !it.tf.o) isO = false; if (!isO && !it.tf.x) isO = true;
    q.text = isO ? it.tf.o : it.tf.x; q.answer = isO ? '○' : '×'; q.choices = ['○','×'];
    q.word = it.mc ? it.mc.a : (it.fr ? it.fr.a : '');
  } else if (type === 'mc') {
    q.text = it.mc.q; q.answer = it.mc.a; q.choices = shuffle(it.mc.c);
  } else {
    q.text = it.fr.q; q.answer = it.fr.a; q.alts = it.fr.alts || [];
  }
  return q;
}
/* 練習用（記述）：問1から「グループ9の問題数」（初期値4）だけグループ9、残りはグループ10。同じパターンは重ねない */
function calcSpec(md){

/* ---------- 枠からはみ出す文字だけ縮小して表示 ---------- */
var measureCtx = document.createElement('canvas').getContext('2d');
function fitText(elm){
  if (!elm) return;
  elm.style.fontSize = '';
  var text = elm.value;
  if (!text) return;
  var cs = getComputedStyle(elm), base = parseFloat(cs.fontSize);
  measureCtx.font = cs.fontStyle + ' ' + cs.fontWeight + ' ' + base + 'px ' + cs.fontFamily;
  var w = measureCtx.measureText(text).width;
  var avail = elm.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 4;

/* テスト名が欄に収まらないときだけ縮める */
function fitTitle(){

/* 「正答」欄がはみ出すときは文字を縮め、それでも入らないときは折り返す */
function fitRight(cell){
  if (!cell) return;
  cell.classList.remove('wrap'); cell.style.removeProperty('--rs');
  if (!cell.textContent || cell.scrollWidth <= cell.clientWidth + 1) return;
  var rs = 1;
  for (var k = 0; k < 6 && cell.scrollWidth > cell.clientWidth + 1; k++) {
    rs = Math.max(0.55, Math.floor(rs * (cell.clientWidth - 2) / cell.scrollWidth * 100) / 100);
    cell.style.setProperty('--rs', rs);
    if (rs <= 0.55) break;
  }
  if (cell.scrollWidth > cell.clientWidth + 1) {   // 縮めても入らないときは折り返す
    cell.classList.add('wrap'); rs = 0.8; cell.style.setProperty('--rs', rs);
    for (var j = 0; j < 6 && (cell.scrollWidth > cell.clientWidth + 1 || cell.scrollHeight > cell.clientHeight + 1); j++) { rs = Math.max(0.45, rs - 0.08); cell.style.setProperty('--rs', rs); }

}

function newSaveId(){ var a = new Uint8Array(8); crypto.getRandomValues(a); return Array.prototype.map.call(a, function(x){ return SAVE_ID_CHARS[x % SAVE_ID_CHARS.length]; }).join(''); }
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function withRetry(fn){
  var i = 0;
  function go(){ return fn().catch(function(e){ i++; if (i >= 3 || (e && (e.code === 'permission-denied' || e.code === 'invalid-argument'))) throw e; return sleep(700 * i + Math.random() * 700).then(go); }); }

}

function submitResult(){
  if (!lastResult || submitBusy || lastResult.id) return;
  submitBusy = true; updateSubmitBtn();
  showSubmitBox('', '<div class="sb-h">保存しています…</div>');
  var r = lastResult, F;
  var data = JSON.stringify({ app:SUBMIT_APP, kind:'result', title:r.title, user:r.user, n:r.n, date:r.date, start:r.start, end:r.end, dur:r.dur,
                              total:r.total, timeout:r.timeout, source:bank.source || '', built:bank.built || '', qs:r.qs });
  fbInit().then(function(f){
    F = f; var tries = 0;
    function pick(){
      if (tries++ >= 5) throw { code:'unavailable' };
      var c = newSaveId();
      return withRetry(function(){ return F.getDoc(F.doc(F.db, 'saves', c)); }).then(function(snap){ return snap.exists() ? pick() : c; });
    }
    return pick();
  }).then(function(id){
    return withRetry(function(){ return F.setDoc(F.doc(F.db, 'saves', id), { v:1, data:data, updated:F.serverTimestamp() }); }).then(function(){ return id; });
  }).then(function(id){
    r.id = id; submitBusy = false; updateSubmitBtn(); showLink(r);
  }).catch(function(e){

    showSubmitBox('err', '<div class="sb-h" style="color:#C00000">' + esc(submitErr(e)) + '</div>');

}

/* ---------- 成績一覧（提出用リンクをまとめて読み込む） ---------- */
var gv = { list:[], lastOnly:true, sortKey:'user', sortAsc:true };
function extractIds(text){
  var out = [], seen = {};
  String(text || '').split(/\r?\n/).forEach(function(line){
    var found = [], m, re1 = /#([a-hj-km-np-z2-9]{8})(?![a-z0-9])/gi, re2 = /(?:^|[\s,;"'\t、，])([a-hj-km-np-z2-9]{8})(?=$|[\s,;"'\t、，])/gi;
    while ((m = re1.exec(line))) found.push(m[1].toLowerCase());
    if (!found.length) while ((m = re2.exec(line))) found.push(m[1].toLowerCase());
    found.forEach(function(id){
      if (seen[id]) return; seen[id] = true;
      var memo = line.replace(/https?:\/\/\S+|file:\/\/\S+/g, '').replace(new RegExp(id, 'ig'), '').replace(/[,\t"]+/g, ' ').replace(/\s+/g, ' ').trim();
      out.push({ id:id, memo:memo.slice(0, 80) });
    });
  });
  return out;
}

  $('gvClose').onclick = function(){ v.hidden = true; };

function fetchGrades(ids){
  if (!ids.length) { $('gvMsg').textContent = '保存IDが見つかりませんでした。提出用リンク（…html#8文字）を貼り付けてください。'; return; }
  $('gvGo').disabled = true; $('gvCsv').disabled = true;
  var done = 0, list = ids.map(function(x){ return { id:x.id, memo:x.memo, d:null, err:'' }; });
  var msg = function(){ $('gvMsg').textContent = '読み込み中… ' + done + ' / ' + list.length; }; msg();
  fbInit().then(function(F){
    var k = 0;
    function worker(){
      if (k >= list.length) return Promise.resolve();
      var r = list[k++];
      return withRetry(function(){ return F.getDoc(F.doc(F.db, 'saves', r.id)); }).then(function(snap){
        if (!snap.exists()) r.err = '見つかりません';
        else { var d = null; try { d = JSON.parse(snap.data().data); } catch(e) {}
          if (!d || d.app !== SUBMIT_APP || d.kind !== 'result') r.err = '十問テストの結果ではありません'; else r.d = d; }
      }, function(e){ r.err = submitErr(e); }).then(function(){ done++; msg(); return worker(); });
    }
    return Promise.all([0,1,2,3,4,5].map(worker));
  }).then(function(){
    gv.list = list; drawGrades();
    var ng = list.filter(function(r){ return r.err; }).length;
    $('gvMsg').textContent = list.length + ' 件を読み込みました' + (ng ? '（読み込めなかったもの ' + ng + ' 件）' : '') + '。';
  }).catch(function(e){ $('gvMsg').textContent = submitErr(e); }).then(function(){ $('gvGo').disabled = false; });
}
function gStamp(d){ return (d.date || '') + ' ' + String(d.end || '').replace(/^(\d):/, '0$1:'); }
function gradeRows(){
  var ok = gv.list.filter(function(r){ return r.d; }), latest = {};
  ok.forEach(function(r){ var u = norm(r.d.user); if (!latest[u] || gStamp(r.d) > gStamp(latest[u].d)) latest[u] = r; });
  var cnt = {}; ok.forEach(function(r){ var u = norm(r.d.user); cnt[u] = (cnt[u] || 0) + 1; });
  ok.forEach(function(r){ var u = norm(r.d.user); r.dup = cnt[u] > 1; r.isLast = latest[u] === r; r.other = !!(r.d.title && r.d.title !== testTitle()); });
  var rows = gv.lastOnly ? ok.filter(function(r){ return r.isLast; }) : ok.slice();
  var key = gv.sortKey, dir = gv.sortAsc ? 1 : -1;
  rows.sort(function(a, b){
    var x, y;
    if (key === 'total') { x = a.d.total; y = b.d.total; }
    else if (key === 'time') { x = gStamp(a.d); y = gStamp(b.d); }
    else { x = String(a.d.user); y = String(b.d.user); }
    if (x < y) return -dir; if (x > y) return dir;
    return gStamp(a.d) < gStamp(b.d) ? -1 : 1;
  });
  return { rows:rows, bad:gv.list.filter(function(r){ return !r.d; }) };
}
function drawGrades(){
  var g = gradeRows(), rows = g.rows;
  var users = {}; rows.forEach(function(r){ users[norm(r.d.user)] = 1; });
  var scores = rows.map(function(r){ return r.d.total; });
  var avg = scores.length ? (scores.reduce(function(a, b){ return a + b; }, 0) / scores.length) : 0;
  $('gvSum').innerHTML = '<div class="gv-sum"><div>表示している提出<b>' + rows.length + '</b> 件</div><div>人数<b>' + Object.keys(users).length + '</b> 人</div>' +
    '<div>平均点<b>' + (scores.length ? avg.toFixed(1) : '—') + '</b></div><div>最高点<b>' + (scores.length ? Math.max.apply(null, scores) : '—') + '</b></div><div>最低点<b>' + (scores.length ? Math.min.apply(null, scores) : '—') + '</b></div>' +
    (g.bad.length ? '<div style="border-color:#C00000;color:#C00000">読み込めなかったもの<b>' + g.bad.length + '</b> 件</div>' : '') + '</div>';
  var arrow = function(k){ return gv.sortKey === k ? (gv.sortAsc ? ' ▲' : ' ▼') : ''; };
  var h = '<table><thead><tr><th>No.</th><th data-k="user">ユーザー名' + arrow('user') + '</th><th>回</th><th data-k="time">日付・終了' + arrow('time') + '</th><th>受験時間</th><th data-k="total">得点' + arrow('total') + '</th>';
  for (var i = 1; i <= 10; i++) h += '<th title="問' + i + '">' + i + '</th>';
  h += '<th>保存ID</th><th>備考</th><th>メモ（貼り付けた行）</th></tr></thead><tbody>';
  rows.forEach(function(r, n){
    var d = r.d, note = [];
    if (r.dup) note.push(r.isLast ? '複数提出（最後）' : '複数提出（前の提出）');
    if (r.other) note.push('別のテスト：' + d.title);
    if (d.timeout) note.push('時間切れ');
    h += '<tr class="' + (r.dup && !r.isLast ? 'dup' : '') + '"><td>' + (n + 1) + '</td><td>' + esc(d.user) + '</td><td>' + esc(d.n) + '</td><td>' + esc(gStamp(d)) + '</td><td>' + esc(d.dur) + '</td><td class="gsc">' + esc(d.total) + '</td>';
    for (var i = 0; i < 10; i++) { var q = (d.qs || [])[i]; h += q ? '<td class="' + (q.ok ? 'ok' : 'ng') + '" title="' + esc(q.text + '\n正解：' + q.answer + '\n解答：' + (q.given || '（空欄）')) + '">' + (q.ok ? '○' : '×') + '</td>' : '<td></td>'; }
    h += '<td><a href="' + esc(submitUrl(r.id)) + '" target="_blank" rel="noopener">' + r.id + '</a></td><td class="l">' + esc(note.join('／')) + '</td><td class="memo" title="' + esc(r.memo) + '">' + esc(r.memo) + '</td></tr>';
  });
  if (rows.length) {
    h += '<tr class="rate"><td colspan="6">正答率</td>';
    for (var i = 0; i < 10; i++) { var c = rows.filter(function(r){ var q = (r.d.qs || [])[i]; return q && q.ok; }).length; h += '<td>' + Math.round(c / rows.length * 100) + '%</td>'; }
    h += '<td colspan="3"></td></tr>';
  }
  g.bad.forEach(function(r){ h += '<tr class="bad"><td>—</td><td colspan="5" class="l">' + esc(r.err) + '</td><td colspan="10"></td><td>' + r.id + '</td><td></td><td class="memo" title="' + esc(r.memo) + '">' + esc(r.memo) + '</td></tr>'; });
  h += '</tbody></table>';
  $('gvTable').innerHTML = h;
  $('gvTable').querySelectorAll('th[data-k]').forEach(function(th){ th.onclick = function(){ var k = th.getAttribute('data-k'); if (gv.sortKey === k) gv.sortAsc = !gv.sortAsc; else { gv.sortKey = k; gv.sortAsc = k !== 'total'; } drawGrades(); }; });
  $('gvCsv').disabled = !rows.length && !g.bad.length;
  fitGrades();
}
function gradesCsv(){
  var g = gradeRows(), head = ['ユーザー名','回','日付','開始','終了','受験時間','得点','時間切れ','保存ID','備考','メモ（貼り付けた行）','テスト名'];
  for (var i = 1; i <= 10; i++) head.push('問' + i + '正誤', '問' + i + '解答', '問' + i + '正解', '問' + i + '問題文');
  var out = [head];
  g.rows.forEach(function(r){
    var d = r.d, row = [d.user, d.n, d.date, d.start, d.end, d.dur, d.total, d.timeout ? '時間切れ' : '', r.id,
      (r.dup ? (r.isLast ? '複数提出（最後）' : '複数提出（前の提出）') : ''), r.memo, d.title];
    for (var i = 0; i < 10; i++) { var q = (d.qs || [])[i] || {}; row.push(q.text ? (q.ok ? 1 : 0) : '', q.given || '', q.answer || '', q.text || ''); }
    out.push(row);
  });
  g.bad.forEach(function(r){ out.push(['', '', '', '', '', '', '', '', r.id, r.err, r.memo, '']); });
  var d = new Date(), stamp = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0') + '_' + String(d.getHours()).padStart(2,'0') + String(d.getMinutes()).padStart(2,'0');
  downloadText(toCsv(out), (testTitle() + '_成績一覧_' + stamp).replace(/[\\/:*?"<>|\s]+/g, '_') + '.csv', 'text/csv');
}

/* ---------- ダイアログ（alert/confirm の代わり） ---------- */
var modal = $('modal'), panel = $('panel'), modalResolve = null;
function openModal(html){ panel.innerHTML = html; modal.hidden = false; var f = panel.querySelector('[data-autofocus]') || panel.querySelector('button,input'); if (f) f.focus(); }
function closeModal(v){ if (modal.hidden) return; modal.hidden = true; panel.innerHTML = ''; var r = modalResolve; modalResolve = null; if (r) r(v); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function dialog(title, msg, buttons){
  return new Promise(function(res){
    if (modalResolve) closeModal();
    var b = buttons.map(function(x, i){ return '<button type="button" class="pbtn' + (x.primary ? ' primary' : '') + '" data-i="' + i + '"' + (x.primary ? ' data-autofocus' : '') + '>' + esc(x.label) + '</button>'; }).join('');
    openModal('<h2>' + esc(title) + '</h2><div class="bd"><p class="msg">' + esc(msg) + '</p></div><div class="ft">' + b + '</div>');
    modalResolve = res;

function countTable(){

    '</div><div class="ft"><button type="button" class="pbtn" id="admClose" data-autofocus>閉じる</button></div></div>');
  $('admClose').onclick = function(){ closeModal(); };
  $('gradeBtn').onclick = openGrades;
  $('viewBtn').onclick = function(){

    if (!SAVE_ID_RE.test(id)) { $('viewMsg').textContent = '保存IDは8文字の英数字です。'; return; }
    closeModal(); if (location.hash === '#' + id) showSubmitted(id); else location.hash = id;

  $('timeForm').addEventListener('submit', function(e){
    e.preventDefault();
    var a = Math.round(Number($('tMain').value)), b = Math.round(Number($('tPrac').value));
    if (!(a >= 1 && a <= 180) || !(b >= 1 && b <= 180)) { $('timeMsg').textContent = '1〜180の整数（分）で入力してください。'; return; }
    var va = $('vMain').checked, vb = $('vPrac').checked;
    bank.settings = Object.assign({}, bank.settings || {}); bank.settings['試験時間（分）'] = String(a); bank.settings['練習用の試験時間（分）'] = String(b);
    bank.settings['経過時間の表示'] = va ? 'する' : 'しない'; bank.settings['練習用の経過時間の表示'] = vb ? 'する' : 'しない';
    showAdmin();

  });
  $('file').addEventListener('change', function(){ if (this.files[0]) loadExcel(this.files[0]); });
  var drop = $('drop');
  drop.addEventListener('dragover', function(e){ e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', function(){ drop.classList.remove('over'); });
  drop.addEventListener('drop', function(e){ e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer.files[0]) loadExcel(e.dataTransfer.files[0]); });
  $('exportBtn').onclick = function(){ var r = panel.querySelector('input[name=expMode]:checked'); exportHtml(r ? r.value : mode()); };

function toCsv(rows){ return '﻿' + rows.map(function(r){ return r.map(function(v){ v = String(v == null ? '' : v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }).join(','); }).join('\r\n'); }
var dlNs = null;
try { if (window.claude && typeof window.claude.use === 'function') window.claude.use('downloads').then(function(n){ dlNs = n; }, function(){}); } catch(e) {}
function downloadText(text, name, type){
  if (dlNs) { dlNs.save({ filename:name, data:text }).catch(function(err){ if (!err || err.code !== 'declined') blobDownload(text, name, type); }); return; }
  blobDownload(text, name, type);
}
function blobDownload(text, name, type){
  var blob = new Blob([text], { type:type + ';charset=utf-8' });
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

    '\n<script id="bank-data" type="application/json">' + strToB64(JSON.stringify(copy)) + '<\/script>\n<script id="app-script">' + scriptText + '<\/script>\n</body>\n</html>\n';
  downloadText(html, fileNameFor(copy.mode), 'text/html');

/* ---------- Excel 読み込み（旧問題集と同じ列構成） ---------- */
function loadScript(src){ return new Promise(function(res, rej){ if (window.XLSX) return res(); var s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = function(){ rej(new Error('load')); }; document.head.appendChild(s); }); }
function loadExcel(file){
  var msg = $('loadMsg'); msg.textContent = '読み込み中…';
  loadScript(SHEETJS).then(function(){
    return file.arrayBuffer();
  }).then(function(buf){
    var wb = window.XLSX.read(buf, { type:'array' });
    var res = parseWorkbook(wb, file.name);
    var keepMode = mode(); bank = res.bank; bank.mode = keepMode; bank.title = titleFor(keepMode); lastWarnings = res.warnings;
    resetView();
    var u = lsGet('jt:user', null); if (u && !$('user').value) $('user').value = u.user || '';
    showAdmin();
    $('loadMsg').textContent = '「' + file.name + '」から ' + bank.items.length + ' 問を読み込みました。' + (res.warnings.length ? '確認が必要な点が ' + res.warnings.length + ' 件あります（上の一覧）。' : '');
  }).catch(function(err){
    msg.textContent = (err && err.message === 'load') ? 'Excelを読むための部品を読み込めませんでした。インターネットに接続してからもう一度試してください。' : '読み込めませんでした：' + (err && err.message ? err.message : err);
  });
}
function cellVal(ws, r, c){
  var cell = ws[window.XLSX.utils.encode_cell({ r:r, c:c })];
  if (!cell || cell.v == null) return '';
  if (cell.t === 'n') return String(cell.v);
  if (cell.t === 'b') return cell.v ? 'TRUE' : 'FALSE';
  if (cell.t === 'e') return '';
  return String(cell.v).replace(/\r\n?/g,'\n').trim();
}
function fillBlank(q, word){ return BLANK_RE.test(q) ? q.replace(BLANK_RE, '【' + word + '】') : ''; }
function parseWorkbook(wb, name){
  var warnings = [], X = window.XLSX;
  var ws = wb.Sheets['問題リスト'];
  if (!ws) throw new Error('「問題リスト」シートが見つかりません。');
  var genres = {}, codeToG = {}, codeNames = {};
  var gs = wb.Sheets['ジャンル'];
  if (gs && gs['!ref']) {
    var gr = X.utils.decode_range(gs['!ref']);
    for (var r=1;r<=gr.e.r;r++){ var code = cellVal(gs,r,0), g = parseInt(cellVal(gs,r,1),10); if (code && g) { codeToG[code] = g; var gn = cellVal(gs,r,2); codeNames[code] = gn; genres[g] = genres[g] && genres[g] !== gn ? genres[g] + '／' + gn : gn; } }
  }
  var settings = {};
  var ss = wb.Sheets['設定'];
  if (ss && ss['!ref']) { var sr = X.utils.decode_range(ss['!ref']); for (var r2=1;r2<=sr.e.r;r2++){ var k = cellVal(ss,r2,0); if (k) settings[k] = cellVal(ss,r2,1); } }
  var roster = [];
  var ns = wb.Sheets['名票'] || wb.Sheets['名簿'];
  if (ns && ns['!ref']) { var nr = X.utils.decode_range(ns['!ref']); for (var r3=1;r3<=nr.e.r;r3++){ var user = cellVal(ns,r3,4) || (cellVal(ns,r3,1) + cellVal(ns,r3,2) + cellVal(ns,r3,3)); var nm = cellVal(ns,r3,5); if (user && nm) roster.push({ id:cellVal(ns,r3,0), user:user, name:nm }); } }
  var items = [], range = X.utils.decode_range(ws['!ref']);
  for (var r4=2;r4<=range.e.r;r4++){
    var v = function(c){ return cellVal(ws, r4, c); };
    var code = v(1), I = v(8), P = v(15);
    if (!code && !I && !P) continue;
    var rowNo = r4 + 1, id = v(0) || ('r' + rowNo);
    var g = codeToG[code] || parseInt(v(2),10);
    if (!g) { warnings.push(rowNo + '行目：記号「' + code + '」がジャンルシートにありません（読み飛ばしました）'); continue; }
    var off = function(c){ return v(c) === '99'; };
    var it = { id:id, g:g, code:code, p:v(24), pt:v(26), mc:null, fr:null, tf:null };
    var J = v(9);
    if (I && J && !off(4)) {
      var ch = [10,11,12,13,14].map(v).filter(function(x){ return x && !PLACEHOLDER.test(x); });
      if (ch.indexOf(J) < 0) { warnings.push(rowNo + '行目：語群の正解「' + J + '」が語１〜語５にありません（正解を語群に加えました）'); ch.push(J); }
      if (ch.length < 2) warnings.push(rowNo + '行目：語群が1語しかありません');
      else it.mc = { q:I, a:J, c:ch };
      if (!BLANK_RE.test(I)) warnings.push(rowNo + '行目：語群の問題文に【　　】がありません');
    }
    var Q = v(16);
    if (P && Q && !off(5)) it.fr = { q:P, a:Q, alts:[17,18,19,20,21].map(v).filter(function(x){ return x && !PLACEHOLDER.test(x); }) };
    else if (P && !Q && !off(5)) warnings.push(rowNo + '行目：記述の正解（Q列）が空です');
    var o = off(6) ? '' : (v(22) || (I && J ? fillBlank(I, J) : ''));
    var x = off(7) ? '' : (v(23) || (I && v(25) ? fillBlank(I, v(25)) : ''));
    if (o || x) it.tf = { o:o, x:x };
    if (!it.mc && !it.fr && !it.tf) { warnings.push(rowNo + '行目：出題できる形式がありません'); continue; }
    items.push(it);
  }
  var d = new Date();
  return { warnings:warnings, bank:{ v:1, mode:'main', title:settings['テスト名'] || name.replace(/\.[^.]+$/,''), settings:settings, genres:genres, codeNames:codeNames, items:items, roster:roster, source:name, built:d.getFullYear() + '/' + (d.getMonth()+1) + '/' + d.getDate() } };
}

/* ---------- 起動 ---------- */
resetView();
var saved = lsGet('jt:user', null);
if (saved && saved.user) { $('user').value = saved.user; if (hasRoster()) { var r0 = lookupName(saved.user); $('name').value = r0 ? r0.name : ''; } else $('name').value = saved.name || ''; }
fitAll();
if (hashId()) showSubmitted(hashId());
window.__jt = { current:function(){ return test; }, state:function(){ return state; }, fileNameFor:fileNameFor, get bank(){ return bank; }, drawTest:drawTest, sameAnswer:sameAnswer, parseWorkbook:parseWorkbook };
})();
